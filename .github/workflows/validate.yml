name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill
        run: python3 scripts/validate_skill.py
      - name: Check plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .cursor-plugin/plugin.json > /dev/null
      - name: Test install.sh
        run: |
          bash -n install.sh
          HOME="$RUNNER_TEMP/home" HUMANIZER_TH_SRC=skills/humanizer-th bash install.sh
          test -f "$RUNNER_TEMP/home/.agents/skills/humanizer-th/SKILL.md"
          HOME="$RUNNER_TEMP/home" bash install.sh --uninstall
          test ! -e "$RUNNER_TEMP/home/.agents/skills/humanizer-th"
      - name: Build zip and prompt bundle
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: humanizer-th
          path: dist/
