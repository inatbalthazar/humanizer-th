name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill
        run: python3 scripts/validate_skill.py
      - name: Test check_translation.py
        run: python3 -m unittest discover tests -v
      - name: Check plugin manifests are valid JSON
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool .cursor-plugin/plugin.json > /dev/null
      - name: Test install.sh
        run: |
          bash -n install.sh
          HOME="$RUNNER_TEMP/home" HUMANIZER_TH_SRC=skills bash install.sh
          for s in humanizer-th localize-th script-th; do
            test -f "$RUNNER_TEMP/home/.agents/skills/$s/SKILL.md"
          done
          HOME="$RUNNER_TEMP/home" bash install.sh --uninstall
          test -z "$(ls -A "$RUNNER_TEMP/home/.agents/skills")"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test npx installer
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          export HOME="$RUNNER_TEMP/npmhome"
          mkdir -p "$HOME/.claude"
          cd "$RUNNER_TEMP"
          npx -y ./humanizer-th-*.tgz
          for s in humanizer-th localize-th script-th; do
            test -f "$HOME/.agents/skills/$s/SKILL.md"
            test -f "$HOME/.claude/skills/$s/SKILL.md"
          done
          npx -y ./humanizer-th-*.tgz uninstall
          test -z "$(ls -A "$HOME/.agents/skills")"
      - name: Build zip and prompt bundle
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: humanizer-th
          path: dist/
