name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate skill
        run: python3 scripts/validate_skill.py
      - name: Check plugin.json is valid JSON
        run: python3 -m json.tool .claude-plugin/plugin.json > /dev/null
      - name: Build zip
        run: bash scripts/build_zip.sh
